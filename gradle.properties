android.useAndroidX=true
# Kotlin/Gradle daemon memory: the default heap intermittently crashes the
# Kotlin backend (IR lowering / method-node transform) and hits GC-overhead
# OOM on parallel --rerun-tasks builds (UNIV-2772).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx3g
