# Pull requests in this repository currently land on local-gate evidence.
# CI is a safety net, not a merge gate.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NUXIE_BAZEL_BATCH: "1"
      NUXIE_BAZEL_JOBS: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;29.0.14206865
            cmake;3.22.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore shared Bazel caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/nuxie/bazel
            ~/.cache/nuxie-tools/bazelisk
            ~/.cache/bazelisk
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'scripts/bazel/locks/*.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'scripts/bazel/locks/*.json') }}-
            ${{ runner.os }}-bazel-

      - name: Install checksummed Bazelisk
        run: >-
          python3 -c 'import sys; sys.path.insert(0, "scripts/bazel"); import launcher; print("NUXIE_BAZEL_BIN=" + launcher.executable())'
          >> "$GITHUB_ENV"

      - name: Restore pinned runtime
        uses: actions/cache@v6
        with:
          path: runtime/prebuilt
          key: ${{ runner.os }}-nuxie-runtime-${{ hashFiles('runtime/artifact.json') }}

      - name: Verify cross-SDK fixtures
        run: scripts/verify-fixtures.sh

      - name: Compile and test the SDK with Bazel
        run: |
          scripts/bazel/sdk.sh test
          scripts/bazel/sdk.sh build
          scripts/bazel/sdk.sh example
          scripts/bazel/sdk.sh instrumentation
          scripts/bazel/sdk.sh prepare --output build/maven-repository

      - name: Qualify the prepared Maven SDK
        run: >-
          python3 scripts/test-maven-consumer.py
          --version "$(python3 -c 'import sys; sys.path.insert(0, "scripts/bazel"); import sdk; print(sdk.declared_version())')"

      - name: Run local gate
        run: >-
          ./gradlew
          :nuxie-android:test
          :nuxie-android:apiCheck
          :nuxie-android:lint
          verifyAndroidReleaseArtifacts
