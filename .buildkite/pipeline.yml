steps:
  - label: ":pipeline: Compose owning SDK confidence lanes"
    key: compose-lanes
    if: build.env("NUXIE_CI_RUNNER_POLICY_VERSION") != "2"
    command: |
      set -euo pipefail
      python3 scripts/ci/pipeline.py | buildkite-agent pipeline upload --no-interpolation
    agents:
      queue: nuxie-pr
    timeout_in_minutes: 5

  - label: ":pipeline: Compose owning SDK confidence lanes"
    key: compose-lanes-v2
    if: build.env("NUXIE_CI_RUNNER_POLICY_VERSION") == "2" && build.env("NUXIE_CI_RUNNER_TOPOLOGY") != "fallback"
    command: |
      set -euo pipefail
      python3 scripts/ci/pipeline.py | buildkite-agent pipeline upload --no-interpolation
    agents:
      queue: nuxie-pr
      nuxie-platform: linux
      nuxie-resources: linux-14g-v2
    env:
      NUXIE_CI_RUNNER_POLICY_VERSION: "2"
      NUXIE_CI_RUNNER_PROFILE: linux-portable
      NUXIE_BAZEL_REMOTE_CACHE_MODE: "off"
    concurrency: 1
    concurrency_group: nuxie/physical/proxmox-heavy
    concurrency_method: eager
    timeout_in_minutes: 5

  - label: ":pipeline: Reject unsupported SDK fallback graph"
    key: compose-lanes-fallback-v2
    if: build.env("NUXIE_CI_RUNNER_POLICY_VERSION") == "2" && build.env("NUXIE_CI_RUNNER_TOPOLOGY") == "fallback"
    command: |
      set -euo pipefail
      python3 scripts/ci/pipeline.py | buildkite-agent pipeline upload --no-interpolation
    agents:
      queue: nuxie-pr
      nuxie-platform: linux
      nuxie-resources: linux-light-6g-v2
    env:
      NUXIE_CI_RUNNER_POLICY_VERSION: "2"
      NUXIE_CI_RUNNER_PROFILE: temporary-light
      NUXIE_BAZEL_REMOTE_CACHE_MODE: "off"
    concurrency: 1
    concurrency_group: nuxie/physical/proxmox-heavy
    concurrency_method: eager
    timeout_in_minutes: 5
